[project]
name = "travel-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhijeet Kumar", email = "154332764+Abhijeet3125@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.151.0",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
travel-agent = "travel_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
